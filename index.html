<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos Profissionais | Instagram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; }
        .hero-mesh {
            background-color: #f43f5e;
            background-image: radial-gradient(at 0% 0%, hsla(343,91%,56%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 100%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        
        /* Estilo das Bolinhas de Destaque */
        .highlight-ring {
            padding: 3px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .highlight-ring:active { transform: scale(0.9); }
        .highlight-inner { border: 2px solid white; border-radius: 50%; overflow: hidden; aspect-ratio: 1/1; }

        /* Modal Estilo Instagram */
        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-window {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-video-card {
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div id="modalOverlay">
        <div class="modal-window">
            <div class="flex items-center justify-between px-6 py-4 text-white">
                <div class="flex items-center gap-2">
                    <i class="fab fa-instagram text-xl"></i>
                    <span class="font-bold tracking-tight">Instagram</span>
                </div>
                <button onclick="closeModal()" class="text-2xl hover:text-rose-400">&times;</button>
            </div>

            <div class="swiper modalSwiper h-full w-full">
                <div class="swiper-wrapper">
                    <div class="swiper-slide px-4">
                        <div class="modal-video-card">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="autoplay" allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="swiper-slide px-4">
                        <div class="modal-video-card">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="autoplay" allowfullscreen></iframe>
                        </div>
                    </div>
                    <div class="swiper-slide px-4">
                        <div class="modal-video-card">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="autoplay" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
                <div class="swiper-button-next !text-white !scale-50"></div>
                <div class="swiper-button-prev !text-white !scale-50"></div>
            </div>
        </div>
    </div>

    <section class="w-full h-[300px] relative">
        <div class="swiper photoSwiper h-full w-full">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <img src="01.jfif" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </section>

    <section class="py-6 bg-white overflow-hidden">
        <div class="container mx-auto">
            <div class="swiper highlightSwiper px-4">
                <div class="swiper-wrapper">
                    <div class="swiper-slide !w-20 text-center cursor-pointer" onclick="openModal()">
                        <div class="highlight-ring mb-1">
                            <div class="highlight-inner">
                                <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=150" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <p class="text-[10px] font-semibold truncate">Empresa A</p>
                    </div>

                    <div class="swiper-slide !w-20 text-center cursor-pointer" onclick="openModal()">
                        <div class="highlight-ring mb-1">
                            <div class="highlight-inner">
                                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=150" class="w-full h-full object-cover">
                            </div>
                        </div>
                        <p class="text-[10px] font-semibold truncate">Empresa B</p>
                    </div>
                    </div>
            </div>
        </div>
    </section>

    <section class="hero-mesh text-white py-12 px-4 text-center">
        <h1 class="text-3xl font-bold">Vídeos Profissionais</h1>
        <p class="mt-2 text-rose-100">Eleve o nível do seu posicionamento digital.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Inicializa carrossel de fotos (Topo)
        new Swiper(".photoSwiper", { loop: true, autoplay: { delay: 3000 } });

        // Inicializa carrossel de bolinhas (Destaques)
        new Swiper(".highlightSwiper", {
            slidesPerView: "auto",
            spaceBetween: 12,
            freeMode: true,
        });

        // Inicializa o carrossel QUE FICA DENTRO do Modal
        const modalSwiper = new Swiper(".modalSwiper", {
            slidesPerView: 1,
            spaceBetween: 20,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });

        // Funções para abrir/fechar o Modal
        const modal = document.getElementById('modalOverlay');

        function openModal() {
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Trava o scroll do site ao fundo
            modalSwiper.update(); // Garante que o carrossel interno carregue certo
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // Destrava o scroll
        }

        // Fecha se clicar fora da janela branca
        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
